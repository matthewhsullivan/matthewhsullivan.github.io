# Tests the site, then publishes it to GitHub Pages, on every push to main.
# If any test fails, nothing is published and the live site stays as it was.
# Requires: Settings > Pages > Source = "GitHub Actions" (this workflow is the only publisher).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test site (links, files, HTML, text, CSS, file sizes)
        run: python3 scripts/check_site.py
      - name: Test JavaScript syntax
        run: for f in assets/js/*.js; do node --check "$f"; done
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html assets _site/
          # Stamp CSS/JS links with this commit so browsers fetch fresh copies after every update.
          v="${GITHUB_SHA::7}"
          sed -i -e "s|assets/css/site.css\"|assets/css/site.css?v=$v\"|g" \
                 -e "s|assets/js/site.js\"|assets/js/site.js?v=$v\"|g" _site/*.html
          grep -c "site.css?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
